<!DOCTYPE html>
<html lang="en" th:fragment="moving_cards(quizPartitions)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quizzes</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4">
    <div class="row">
        <!-- Left Button Column -->
        <div class="col-1 d-flex justify-content-center align-items-center">
            <button class="carousel-control-prev" type="button" data-bs-target="#quizCarousel" data-bs-slide="prev">
                <span class="carousel-control-prev-icon rounded-circle" aria-hidden="true" style="background-color: black;"></span>
                <span class="visually-hidden">Previous</span>
            </button>
        </div>

        <!-- Carousel Items Column (Middle) -->
        <div class="col-10">
            <div id="quizCarousel" class="carousel slide" data-bs-ride="carousel" data-bs-interval="3000">
                <div class="carousel-inner">
                    <div th:each="partition, iterStat : ${quizPartitions}">
                        <div class="carousel-item" th:classappend="${iterStat.index == 0 ? ' active' : ''}">
                            <div class="row">
                                <div th:each="quiz : ${partition}" class="col-md-4">
                                    <div class="card" style="width: 18rem;">
<!--                                        <img th:src="${quiz.img}" class="card-img-top" alt="Quiz Image">-->
                                        <div class="card-body">
                                            <h5 th:text="${quiz.title}"></h5>
                                            <p th:text="${quiz.description}"></p>
                                            <a th:href="@{'/quiz/view/' + ${quiz.id}}" class="btn btn-primary">View Quiz</a>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Button Column -->
        <div class="col-1 d-flex justify-content-center align-items-center">
            <button class="carousel-control-next" type="button" data-bs-target="#quizCarousel" data-bs-slide="next">
                <span class="carousel-control-next-icon rounded-circle" aria-hidden="true" style="background-color: black;"></span>
                <span class="visually-hidden">Next</span>
            </button>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
