<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quiz Result</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Add your CSS styling here */
        body {
            background-color: #f4f4f4;
            font-family: sans-serif;
        }

        .result-container {
            max-width: 800px;
            margin: 50px auto;
            background-color: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .result-title {
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 30px;
            text-align: center;
        }

        .question-result {
            margin-bottom: 20px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: #f9f9f9;
        }

        .question-text {
            font-size: 1.2rem;
            font-weight: 500;
            margin-bottom: 10px;
        }

        .answer-text {
            margin-bottom: 5px;
        }

        .correct-answer {
            color: #28a745; /* Green */
        }

        .incorrect-answer {
            color: #dc3545; /* Red */
        }

        .score-container {
            text-align: center;
            margin-top: 20px;
            font-size: 1.5rem;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="result-container">
        <h2 class="result-title">Quiz Result</h2>

        <div th:if="${testResult != null and testResult.studentAnswers != null}">  <div th:each="studentAnswer : ${testResult.studentAnswers}">
            <div class="question-result" th:if="${studentAnswer.question != null}">  <p class="question-text" th:text="${studentAnswer.question.questionText}"></p>

                <p class="answer-text">
                    Your Answer:
                    <span th:if="${studentAnswer.selectedOption != null}" th:text="${studentAnswer.selectedOption.optionText}"></span>
                    <span th:unless="${studentAnswer.selectedOption != null}">No answer selected</span>
                </p>

                <p class="answer-text">
                    Correct Answer:
                    <span th:if="${studentAnswer.question.answers != null}">
                            <span th:each="answer : ${studentAnswer.question.answers}" th:if="${answer.isCorrect}" th:text="${answer.optionText}"></span>
                        </span>
                    <span th:unless="${studentAnswer.question.answers != null}">No correct answer found</span>
                </p>

                <p th:if="${studentAnswer.isCorrect}" class="correct-answer">Correct!</p>
                <p th:unless="${studentAnswer.isCorrect}" class="incorrect-answer">Incorrect.</p>
            </div>
        </div>
        </div>
        <div th:unless="${testResult != null and testResult.studentAnswers != null}">
            <p>No results available yet.</p>
        </div>

        <div class="score-container">
            Your Score: <span th:text="${testResult.score}"></span> / <span th:text="${testResult.quiz.questions.size()}"></span>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
