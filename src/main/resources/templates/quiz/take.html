<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<form th:action="@{/quiz/submitAnswer/{testResultId}(testResultId=${testResult.id})}" method="post">
    <div th:each="answer : ${answers}">
        <input type="radio" name="selectedAnswerId" th:value="${answer.id}" th:id="${'answer' + answer.id}">
        <label th:for="${'answer' + answer.id}" th:text="${answer.optionText}"></label><br>
    </div>
    <button type="submit">Next Question</button>
</form>
</body>
</html>
