<!DOCTYPE html>
<html lang="en" th:replace="shared/_layout::layout('Home Page',~{::div#quiz-list},~{::style#css},~{::script#scr})">

<style>
    .custom-card {
        max-width: 100%; /* Let Bootstrap grid control card width */
        min-height: 450px; /* Set a fixed minimum height for uniformity */
        display: flex;
        flex-direction: column;
        justify-content: space-between; /* Footer stays at the bottom */
    }

    .card-img-top {
        height: 200px;
        object-fit: cover; /* Maintain aspect ratio of the image */
        border-bottom: 2px solid #007bff; /* Highlight image with a border */
    }

    .card-body {
        flex-grow: 1;
        padding: 15px;
    }

    .card-footer {
        background-color: #f8f9fa;
        border-top: 1px solid #ddd;
    }

    .container h2 {
        font-weight: bold;
        color: #007bff;
        margin-bottom: 20px;
        text-align: center; /* Center the heading */
    }

    .row {
        justify-content: center; /* Center all rows */
    }

    /* Add spacing between rows */
    .custom-row {
        margin-bottom: 30px;
    }

    .add-quiz-btn {
        font-size: 1.2rem;
        font-weight: bold;
        color: white;
        background-color: #007bff;
        border: none;
        padding: 10px 20px;
        border-radius: 5px;
        transition: all 0.3s ease;
    }

    .add-quiz-btn:hover {
        background-color: #0056b3;
    }

    /* Extra responsiveness for smaller screens */
    @media (max-width: 768px) {
        .custom-row {
            flex-direction: column; /* Stack cards vertically */
            gap: 20px;
        }
    }
</style>

<body>
<div id="quiz-list">
    <div class="container mt-5">
        <!-- Add New Quiz Button -->
        <div class="text-center mb-4">
            <a th:href="@{/quiz/create/quiz}" class="add-quiz-btn">+ Add New Quiz</a>
        </div>

         Recent Quizzes Section
        <div class="container">
            <h2>Recent Quizzes</h2>

            <div th:unless="${quiz != null && quiz.size() > 0}" class="text-center">
                <p>No quizzes available at the moment. Create a new one!</p>
            </div>

            <div th:if="${quiz != null && quiz.size() > 0}">
                <div class="row custom-row">
                    <!-- Loop through each quiz -->
                    <div th:each="quiz : ${quiz}" class="col-md-6 mb-4">
                        <div class="card custom-card shadow p-2 bg-white rounded">
                            <!-- Quiz Image -->
                            <img th:src="${quiz.img}" class="card-img-top" alt="Quiz Image" />
                            <!-- Card Body -->
                            <div class="card-body">
                                <h5 class="card-title text-primary" th:text="${quiz.title}">Quiz Title</h5>
                                <p class="card-text" th:text="${quiz.description}">Quiz Description</p>
                                <p class="card-text"><strong>Author:</strong> <span th:text="${quiz.createdByUsername}">Author Name</span></p>
                                <p class="card-text"><strong>Category:</strong> <span th:text="${quiz.category}">Quiz Category</span></p>
                            </div>
                            <!-- Card Footer -->
                            <div class="card-footer text-center">
                                <a th:href="@{/quiz/view/{id}(id=${quiz.id})}" class="btn btn-primary">Open Quiz</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
