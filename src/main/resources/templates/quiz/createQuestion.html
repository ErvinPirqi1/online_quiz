<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Questions</title>
    <script>
        function addQuestionForm() {
            let container = document.getElementById("questionsContainer");

            let questionIndex = container.children.length;

            let questionForm = document.createElement("div");
            questionForm.classList.add("question-form");
            questionForm.innerHTML = `
                <h3>Question ${questionIndex + 1}</h3>
                <label>Question:</label>
                <input type="text" name="questions[${questionIndex}].questionText" required/><br>

                <label>Type:</label>
                <select name="questions[${questionIndex}].questionType" onchange="toggleOptions(${questionIndex}, this.value)">
                    <option value="0">Multiple Choice</option>
                    <option value="1">True/False</option>
                </select><br>

                <div id="optionsContainer${questionIndex}">
                    <div>
                        <label>Option 1:</label>
                        <input type="text" name="questions[${questionIndex}].options[0].text" required/>
                        <input type="radio" name="questions[${questionIndex}].correctAnswer" value="0"/> Correct?
                    </div>
                    <div>
                        <label>Option 2:</label>
                        <input type="text" name="questions[${questionIndex}].options[1].text" required/>
                        <input type="radio" name="questions[${questionIndex}].correctAnswer" value="1"/> Correct?
                    </div>
                </div>

                <button type="button" onclick="addOption(${questionIndex})">Add Another Option</button>
                <hr>
            `;
            container.appendChild(questionForm);
        }

        function addOption(questionIndex) {
            let optionsContainer = document.getElementById("optionsContainer" + questionIndex);
            let optionCount = optionsContainer.children.length;

            let optionDiv = document.createElement("div");
            optionDiv.innerHTML = `
                <label>Option ${optionCount + 1}:</label>
                <input type="text" name="questions[${questionIndex}].options[${optionCount}].text" required/>
                <input type="radio" name="questions[${questionIndex}].correctAnswer" value="${optionCount}"/> Correct?
            `;
            optionsContainer.appendChild(optionDiv);
        }

        function toggleOptions(questionIndex, type) {
            let optionsContainer = document.getElementById("optionsContainer" + questionIndex);
            if (type == "1") {  // True/False
                optionsContainer.innerHTML = `
                    <div>
                        <label>True</label>
                        <input type="radio" name="questions[${questionIndex}].correctAnswer" value="true" required/>
                    </div>
                    <div>
                        <label>False</label>
                        <input type="radio" name="questions[${questionIndex}].correctAnswer" value="false" required/>
                    </div>
                `;
            } else {  // Multiple Choice
                optionsContainer.innerHTML = `
                    <div>
                        <label>Option 1:</label>
                        <input type="text" name="questions[${questionIndex}].options[0].text" required/>
                        <input type="radio" name="questions[${questionIndex}].correctAnswer" value="0"/> Correct?
                    </div>
                    <div>
                        <label>Option 2:</label>
                        <input type="text" name="questions[${questionIndex}].options[1].text" required/>
                        <input type="radio" name="questions[${questionIndex}].correctAnswer" value="1"/> Correct?
                    </div>
                `;
            }
        }
    </script>
</head>
<body>

<h2>Add Questions to Quiz</h2>

<form th:action="@{/quiz/create/question/{quizId}(quizId=${quizId})}" method="post">
    <div id="questionsContainer">
        <!-- Questions will be dynamically added here -->
    </div>

    <button type="button" onclick="addQuestionForm()">Add Question</button>
    <button type="submit">Submit Questions</button>
</form>

<form th:action="@{/quiz/finish/{quizId}(quizId=${quizId})}" method="post">
    <button type="submit">Finish Quiz</button>
</form>

</body>
</html>
