<!DOCTYPE html>
<html lang="en" th:replace="~{shared/_layout::layout('Quiz Details', ~{::div#cont}, ~{::style#css}, ~{::script#scr})}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style id="css">
        .container {
            max-width: 800px;
            margin: 0 auto;
            text-align: center; /* Center text within the container */
        }

        .btn-container {
            display: flex;
            justify-content: center; /* Center buttons horizontally */
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn-primary, .btn-success {
            border-radius: 5px;
            padding: 10px 15px;
        }

        .btn-primary {
            background-color: #007bff;
            border-color: #007bff;
        }

        .btn-success {
            background-color: #28a745;
            border-color: #28a745;
        }

        .btn-lg {
            font-size: 1.2rem;
            padding: 15px 25px;
            margin-bottom: 20px; /* Margin below Start Quiz button */
        }

        .quiz-details {
            margin-bottom: 20px;
        }

        .quiz-title {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .quiz-meta {
            color: #6c757d;
            margin-bottom: 10px;
        }

        .quiz-description {
            margin-bottom: 20px;
        }

        .quiz-actions {
            display: flex;
            justify-content: center; /* Center the Start Quiz button */
        }
    </style>
</head>
<body>

<div class="container mt-5" id="cont">
    <div class="row justify-content-center"> <div class="col-md-8">

        <div class="quiz-details">
            <h2 class="quiz-title" th:text="${quiz?.title}"></h2>
            <p class="quiz-meta" th:text="${'Category: ' + quiz?.category}"></p>
            <p class="quiz-meta" th:text="${'Created by: ' + quiz?.createdByUsername}"></p>
            <p class="quiz-description" th:text="${quiz?.description}"></p>
        </div>

        <div class="quiz-actions">
            <a th:if="${quiz != null and (quiz.visibility == 1 or #authorization.expression('isAuthenticated()'))}" th:href="@{'/quiz/start/' + ${quiz?.id}}" class="btn btn-primary btn-lg">Start Quiz</a>
        </div>

        <div class="btn-container" th:if="${quiz != null and isQuizCreator}">
            <a th:href="@{/quiz/edit/{id}(id=${quiz?.id})}" class="btn btn-primary">Modify Quiz</a>
            <a th:href="@{/quiz/toggleVisibility/{id}(id=${quiz?.id})}" class="btn btn-primary">Toggle Visibility</a>
            <a th:href="@{'/quiz/details/' + ${quiz?.id}}" class="btn btn-success">Quiz Details</a>
        </div>

    </div>
    </div>
</div>

<script id="scr">
    /* Your scripts if any */
</script>

</body>
</html>
