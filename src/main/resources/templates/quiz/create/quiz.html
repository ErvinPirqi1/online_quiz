<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Create Quiz</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>
<body>
<div class="container mt-5">
    <div class="card">
        <div class="card-body">
            <h5 class="card-title">Create a New Quiz</h5>

            <form th:action="@{/quiz/create/quiz}" th:object="${quiz}" method="post" enctype="multipart/form-data">

                <!-- Hidden field for username (temporary until user auth is implemented) -->
                <input type="hidden" th:field="*{createdByUsername}" th:value="${user != null ? user.username : 'test_user'}"/>

                <div class="row mb-3">
                    <label for="title" class="col-sm-2 col-form-label">Quiz Title:</label>
                    <div class="col-sm-6">
                        <input type="text" class="form-control" th:field="*{title}" required minlength="3" maxlength="100"/>
                    </div>
                    <div class="col-sm-4">
                        <span class="text-danger" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></span>
                    </div>
                </div>

                <div class="row mb-3">
                    <label for="description" class="col-sm-2 col-form-label">Description:</label>
                    <div class="col-sm-6">
                        <textarea class="form-control" th:field="*{description}" rows="3" required></textarea>
                    </div>
                    <div class="col-sm-4">
                        <span class="text-danger" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></span>
                    </div>
                </div>

                <div class="row mb-3">
                    <label for="img" class="col-sm-2 col-form-label">Quiz Image:</label>
                    <div class="col-sm-6">
                        <input type="file" class="form-control" id="img" name="img" accept="image/*" required onchange="previewImage(event)"/>
                        <img id="imagePreview" class="mt-2 img-thumbnail" style="display:none; width: 150px; height: 150px;"/>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-sm-2"></div>
                    <div class="col-sm-6">
                        <button type="submit" class="btn btn-primary">Create Quiz</button>
                        <button type="reset" class="btn btn-danger">Reset</button>
                        <a onclick="window.history.back()" class="btn btn-secondary">Back</a>
                    </div>
                </div>

            </form>
        </div>
    </div>
</div>

<script>
    function previewImage(event) {
        let reader = new FileReader();
        reader.onload = function() {
            let imgElement = document.getElementById('imagePreview');
            imgElement.src = reader.result;
            imgElement.style.display = 'block';
        };
        reader.readAsDataURL(event.target.files[0]);
    }
</script>
</body>
</html>
