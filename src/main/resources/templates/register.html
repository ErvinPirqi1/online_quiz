<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User Registration</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h2 class="text-center mb-4">Register</h2>

            <!-- Display error message if registration fails -->
            <div th:if="${param.error}" class="alert alert-danger">
                <span th:text="${param.error}">Error message</span>
            </div>

            <!-- Display success message if registration is successful -->
            <div th:if="${param.registrationSuccess}" class="alert alert-success">
                Registration successful! Please log in.
            </div>

            <!-- Registration Form -->
            <form th:action="@{/register}" th:object="${userRegisterDto}" method="post">
                <!-- Username -->
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" class="form-control" id="username" th:field="*{username}" required>
                    <div th:if="${#fields.hasErrors('username')}" class="text-danger">
                        <span th:errors="*{username}">Username error</span>
                    </div>
                </div>

                <!-- Password -->
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" th:field="*{password}" required>
                    <div th:if="${#fields.hasErrors('password')}" class="text-danger">
                        <span th:errors="*{password}">Password error</span>
                    </div>
                </div>

                <!-- Confirm Password -->
                <div class="mb-3">
                    <label for="confirmPassword" class="form-label">Confirm Password</label>
                    <input type="password" class="form-control" id="confirmPassword" th:field="*{confirmPassword}" required>
                    <div th:if="${#fields.hasErrors('confirmPassword')}" class="text-danger">
                        <span th:errors="*{confirmPassword}">Confirm password error</span>
                    </div>
                </div>

                <!-- Name -->
                <div class="mb-3">
                    <label for="name" class="form-label">Name</label>
                    <input type="text" class="form-control" id="name" th:field="*{name}" required>
                    <div th:if="${#fields.hasErrors('name')}" class="text-danger">
                        <span th:errors="*{name}">Name error</span>
                    </div>
                </div>

                <!-- Surname -->
                <div class="mb-3">
                    <label for="surname" class="form-label">Surname</label>
                    <input type="text" class="form-control" id="surname" th:field="*{surname}" required>
                    <div th:if="${#fields.hasErrors('surname')}" class="text-danger">
                        <span th:errors="*{surname}">Surname error</span>
                    </div>
                </div>

                <!-- Email -->
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" th:field="*{email}" required>
                    <div th:if="${#fields.hasErrors('email')}" class="text-danger">
                        <span th:errors="*{email}">Email error</span>
                    </div>
                </div>

                <!-- Role -->
                <div class="mb-3">
                    <label for="role" class="form-label">Role</label>
                    <select class="form-select" id="role" th:field="*{role}" required>
                        <option value="">Select Role</option>
                        <option th:each="role : ${T(dev.ervin.online_quiz.models.Role).values()}"
                                th:value="${role}"
                                th:text="${role}">Role</option>
                    </select>
                    <div th:if="${#fields.hasErrors('role')}" class="text-danger">
                        <span th:errors="*{role}">Role error</span>
                    </div>
                </div>

                <!-- Submit Button -->
                <div class="d-grid">
                    <button type="submit" class="btn btn-primary">Register</button>
                </div>
            </form>

            <!-- Link to Login Page -->
            <div class="mt-3 text-center">
                <p>Already have an account? <a th:href="@{/login}">Login here</a></p>
            </div>
        </div>
    </div>
</div>
</body>
</html>
