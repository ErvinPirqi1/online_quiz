# Reset the database schema on application startup

spring.datasource.url=jdbc:postgresql://localhost:5432/quiz_db
spring.datasource.username=admin
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate DDL mode settings for automatic schema management
spring.jpa.hibernate.ddl-auto=create-drop
## Optional: To see SQL queries being executed (helpful for debugging)
#logging.level.org.springframework.orm.jpa=DEBUG
#logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.hibernate.type.descriptor.sql=DEBUG
#
## Other custom logging levels
#logging.level.dev.ervin.online_quiz=DEBUG
logging.level.org.springframework.security=DEBUG
spring.thymeleaf.cache=false
